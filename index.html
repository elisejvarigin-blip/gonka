const setTrack=i=>{i=(i+4)%4;SV.track=i;buildTrack(i);$('tn2').textContent=TH[i].n;coinsUI();save()};
$('tp').onclick=()=>setTrack(TID-1);$('tnx').onclick=()=>setTrack(TID+1);
$('ql').onchange=e=>setQ(e.target.value);$('un2').onchange=e=>{unit=e.target.value;$('un').textContent=unit==='kmh'?'км/ч':'mph'};
$('ctl').onchange=e=>{ctl=e.target.value;if(ctl==='tilt'&&window.DeviceOrientationEvent&&DeviceOrientationEvent.requestPermission)DeviceOrientationEvent.requestPermission().catch(()=>{})};
function fsw(){const d=document,e=d.documentElement;if(d.fullscreenElement||d.webkitFullscreenElement){(d.exitFullscreen||d.webkitExitFullscreen).call(d)}else{const p=e.requestFullscreen||e.webkitRequestFullscreen;if(p){const r=p.call(e);if(r&&r.then)r.then(()=>{try{screen.orientation.lock('landscape').catch(()=>{})}catch(x){}}).catch(()=>{})}}}
$('fs').onclick=$('bfs').onclick=fsw;$('bcam').onclick=()=>cam=(cam+1)%3;$('bps').onclick=togglePause;
function renderLobby(){if(!room)return;$('rc').textContent=room.code;const my=room.pl.find(p=>p.id===sock.id);
$('pl').textContent=room.pl.map(p=>(p.id===sock.id?'Вы':'Друг')+': '+CARS[p.car].n+(p.ready?' ✓ готов':' …')).join('\n')+(room.pl.length<2?'\nЖдём друга…':'');
$('rd').textContent=my&&my.ready?'Не готов':'Готов';$('rd').disabled=room.pl.length<2;$('rl').disabled=$('rt').disabled=!(my&&my.host);$('rl').value=room.laps;$('rt').value=room.track}
$('mk').onclick=()=>{audio();const s=net();if(!s)return;s.emit('create',r=>{if(r.ok){s.emit('car',carIdx,colOf(carIdx));s.emit('setup',{laps:+$('lp').value,track:TID});show('lobby');st='lobby'}})};
function joinCode(c){audio();const s=net();if(!s)return;s.emit('join',c,r=>{if(r.err){$('err').textContent=r.err;return}s.emit('car',carIdx,colOf(carIdx));show('lobby');st='lobby'})}
$('jn').onclick=()=>joinCode($('jc').value);
$('rd').onclick=()=>{const m=room.pl.find(p=>p.id===sock.id);sock.emit('ready',!m.ready)};
$('rl').onchange=$('rt').onchange=()=>sock.emit('setup',{laps:+$('rl').value,track:+$('rt').value});
$('lv').onclick=()=>{sock.emit('leave');room=null;st='menu';show('menu')};
$('cl').onclick=()=>{const u=location.origin+'/?room='+room.code;(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>$('cl').textContent='Скопировано',()=>prompt('Ссылка для друга:',u))};
function soloStart(){audio();mode='solo';MD=$('md').value;laps=MD==='time'?1:MD==='endure'?8:MD==='free'?999:+$('lp').value;startRace(laps,spawnAt(TID,0),3000)}
$('solo').onclick=soloStart;
function startRace(l,sp,ms){laps=l;me.x=sp.x;me.z=sp.z;me.h=sp.h;me.vx=me.vz=0;me.pr=0;me.st=0;me.nit=.3;me.dr=0;me.boost=0;fin=0;oppPr=0;buf=[];resetOb();
if(oppCar){scene.remove(oppCar.g);oppCar=null}
if(mode==='mp'&&room){const o=room.pl.find(p=>p.id!==sock.id);oppCar=mkCar(CARS[o?o.car:1],o?o.col:0xffffff)}
t0=performance.now()+ms;st='count';show(null);hud(true);if('ontouchstart'in window||ctl!=='kb')$('tc').classList.remove('h')}
function finish(t,d,mp){beep(t==='Поражение'?200:700,.6,'triangle',.2);$('et').textContent=t;$('ed').textContent=d;$('eb').textContent=mp?'В комнату':'В меню';$('end').dataset.mp=mp?1:'';show('end');hud(false);$('tc').classList.add('h');$('cd').textContent='';coinsUI()}
function endSolo(){const ms=performance.now()-tStart;let msg,c=0;
if(MD==='drift'){c=Math.round(me.dr/10);msg='Очки заноса: '+Math.round(me.dr)}
else{c=MD==='endure'?900:MD==='time'?250:300+laps*50;msg=(ms/1000).toFixed(2)+' с';if(MD==='time'||MD==='race'){const b=SV.best[TID];if(MD==='time'){if(!b||ms<b){SV.best[TID]=ms;msg+=' · новый рекорд!';c+=150}else msg+=' · рекорд '+(b/1000).toFixed(2)+' с'}}}
SV.coins+=c;save();finish('Финиш!',msg+' · +'+c+' ¤')}
$('eb').onclick=()=>{if($('end').dataset.mp&&room){st='lobby';show('lobby');renderLobby()}else{st='menu';show('menu')}buf=[];if(oppCar){scene.remove(oppCar.g);oppCar=null}const sp=spawnAt(TID,0);me.x=sp.x;me.z=sp.z;me.h=sp.h;me.vx=me.vz=0;coinsUI()};
function togglePause(){if(mode!=='solo'||(st!=='run'&&st!=='count'&&st!=='paused'))return;if(st==='paused'){const d=performance.now()-pT;st=pst;t0+=d;tStart+=d;show(null)}else{pst=st;pT=performance.now();st='paused';show('pause')}}
$('pr').onclick=togglePause;$('prs').onclick=()=>{st='run';soloStart()};$('pm').onclick=()=>{st='menu';show('menu');hud(false);$('tc').classList.add('h')};
// ---------- цикл
const mx=$('mm').getContext('2d');
function drawMM(o){mx.clearRect(0,0,140,100);mx.drawImage(mmB,0,0);const dot=(x,z,c)=>{const[a,b]=tm({x,z});mx.fillStyle=c;mx.beginPath();mx.arc(a,b,4,0,TAU);mx.fill()};if(o&&oppCar)dot(o.x,o.z,'#4fc3f7');dot(me.x,me.z,'#ff4a3d')}
function pose(c,x,z,h,steer,spin){c.g.position.set(x,.06,z);c.g.rotation.y=h;c.wh.forEach((w,i)=>{w.w.rotation.x+=spin;if(i<2)w.p.rotation.y=steer})}
let last=performance.now(),acc=0,sendT=0,smk=0;
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.1,(now-last)/1000);last=now;
if(st==='count'){const r=t0-now;$('cd').textContent=r>0?Math.ceil(r/1000):'СТАРТ!';if(r<=0){st='run';tStart=now;beep(880,.5,'square',.15)}}
else if(st==='run'&&$('cd').textContent&&now-t0>700)$('cd').textContent='';
if(st==='run'||st==='count'||st==='done'){acc+=dt;while(acc>=1/60){step(1/60);acc-=1/60}}
if(st==='run'&&mode==='mp'&&sock&&now-sendT>50){sendT=now;sock.emit('st',{x:me.x,z:me.z,h:me.h,v:me.vl})}
const c=mine.car,spin=me.vl*dt/.38;pose(c,me.x,me.z,me.h,me.st*.4,spin);
c.b.rotation.z=-me.st*Math.min(1,Math.abs(me.vl)/40)*.07;c.b.rotation.x=-me.ac*.0028;c.fl.forEach(f=>{f.visible=!!me.boost;f.scale.z=.7+rnd()*.7});
const o=oppPos();if(oppCar&&o)pose(oppCar,o.x,o.z,o.h,0,o.v*dt/.38);
// дым и пыль
if((st==='run')&&(me.slip>4||K.sp&&Math.abs(me.vl)>8)){const fx=Math.sin(me.h),fz=Math.cos(me.h);for(const s of[-.8,.8])emit(me.x-fx*c.d.L*.3-fz*s,.3,me.z-fz*c.d.L*.3+fx*s,(rnd()-.5)*2,1+rnd(),(rnd()-.5)*2)}
updP(dt);for(let i=OBF.length-1;i>=0;i--){const o=OBF[i];o.t+=dt;if(o.t<1){o.x+=o.vx*dt;o.z+=o.vz*dt;o.y=6*o.t*(1-o.t);o.rz=o.t*9;o.rx=o.t*5}else{o.y=0;o.rz=1.45;o.rx=0;OBF.splice(i,1)}setOb(o)}
// камера
const fx=Math.sin(me.h),fz=Math.cos(me.h),L=c.d.L;c.g.visible=cam===0||st==='menu'||st==='lobby';
if(st==='menu'||st==='lobby'){const a=now/3500;camr.position.set(me.x+Math.sin(a)*(L+5),2.2,me.z+Math.cos(a)*(L+5));camr.lookAt(me.x,.7,me.z);camr.fov=50}
else if(cam===0){const k=1-Math.exp(-dt*6);camr.position.x+=(me.x-fx*(L+4)-camr.position.x)*k;camr.position.z+=(me.z-fz*(L+4)-camr.position.z)*k;camr.position.y=3.4+(me.boost?rnd()*.06:0);camr.lookAt(me.x+fx*7,1.2,me.z+fz*7);camr.fov=62+Math.min(20,Math.abs(me.vl)*.22)+me.boost*10}
else{const f=cam===1?.3:L/2,y=cam===1?1.45:.5;camr.position.set(me.x+fx*f,y,me.z+fz*f);camr.lookAt(me.x+fx*30,y-.1,me.z+fz*30);camr.fov=70+Math.min(20,Math.abs(me.vl)*.22)+me.boost*10}
camr.updateProjectionMatrix();sky.position.copy(camr.position);
sun.position.set(me.x+60,90,me.z+40);sun.target.position.set(me.x,0,me.z);
// HUD
if(!$('hud').classList.contains('h')){const sp=Math.abs(me.vl),cv=CARS[carIdx],fr=Math.min(1,sp/cv.vmax),gear=me.vl<-1?'R':sp<1?'N':Math.min(6,1+Math.floor(fr*6)),band=(fr*6)%1;
$('kmh').textContent=Math.round(sp*(unit==='kmh'?3.6:2.237));$('gr').textContent='Передача '+gear;$('rb').style.width=(Math.min(1,.2+band*.8)*100)+'%';$('nb').style.width=(me.nit*100)+'%';
const tms=(st==='done'&&fin?fin:now-tStart)/1000,tm_=st==='run'||st==='done'?tms.toFixed(1):'0.0';let tx='';
if(mode==='mp'&&o){const dn=(p,pr)=>{const n=CPS[(pr+1)%N];return Math.hypot(p.x-n.x,p.z-n.z)};const lead=me.pr>oppPr||(me.pr===oppPr&&dn(me,me.pr)<dn(o,oppPr));tx+='Позиция '+(lead?1:2)+'/2 · '+(lead?'впереди':'позади')+' на '+Math.round(Math.hypot(me.x-o.x,me.z-o.z))+' м<br>'}
if(MD==='free')tx+='Свободная езда';else if(MD==='drift')tx+='Очки '+Math.round(me.dr)+' · осталось '+Math.max(0,60-(st==='run'?tms:0)).toFixed(0)+' с';else tx+='Круг '+Math.min(laps,Math.floor(me.pr/N)+1)+'/'+laps+'<br>Время '+tm_;
$('top').innerHTML=tx;drawMM(o)}
if(AC&&eg){const fr=Math.min(1,Math.abs(me.vl)/CARS[carIdx].vmax),on=st==='run'||st==='count',T=AC.currentTime;eo.frequency.setTargetAtTime(40+fr*80+((fr*6)%1)*40+me.boost*30,T,.06);eg.gain.setTargetAtTime(on?.03+(K.w?.02:0)+me.boost*.02:0,T,.08);sg.gain.setTargetAtTime(on&&me.slip>6&&Math.abs(me.vl)>10?Math.min(.05,(me.slip-6)*.01):0,T,.08)}
R.render(scene,camr)}
// ---------- запуск
const mob=matchMedia('(pointer:coarse)').matches;
setQ(mob?0:2);$('ql').value=mob?0:2;if(mob){ctl='btn';$('ctl').value='btn'}
carIdx=SV.car||0;buildTrack(SV.track||0);$('tn2').textContent=TH[TID].n;setCar();resize();requestAnimationFrame(loop);
const prm=new URLSearchParams(location.search).get('room');if(prm){$('jc').value=prm;setTimeout(()=>joinCode(prm),400)}
</script></body></html>
